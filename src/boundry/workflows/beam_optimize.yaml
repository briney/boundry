workflow_version: 1

project_path: .
interface: null
scan_chains: null

# number of independent design campaigns
num_campaigns: 1

# number of iterations for the initial relax operation
# relax is done separately for each campaign
relax_iterations: 10

# number of rounds of design, with each round consisting of
# beam search over single-position designs
design_cycles: 10

# beam_width is the number of designs to keep from each beam expansion
beam_width: 4

# beam_expansion should be >= the expected number of "bad" positions
# (interface residues that don't contribute to binding) so that
# random sampling covers most of them
beam_expansion: 25

input: input.pdb
seed: 42
workers: 16

# expand_factor should be >= the expected number of bad positions
# so random sampling covers most of them
expand_factor: 20

steps:
  # Step 1: Fix backbone geometry once
  - operation: idealize

  - iterate:
      n: ${num_campaigns}
      steps:
        # initial relax (just once per design cycle)
        - operation: relax
          params:
            n_iterations: ${relax_iterations}

        # iterative improvement rounds
        - iterate:
            n: ${design_cycles}
            steps:
              # analyze interface to find bad positions
              - operation: analyze_interface
                params:
                  calculate_binding_energy: true
                  alanine_scan: true
                  chain_pairs: ${interface}
                  scan_chains: ${scan_chains}

              # checkpoint the current "parent" for this round
              - checkpoint: parent

              # beam search over single-position designs
              #   - each expansion picks 1 random bad position and designs it.
              #   - with beam_expansion=20, we sample 20 random positions
              #   - with beam_width=4 we keep the best 4, scored by by dG improvement vs parent.
              - beam:
                  width: ${beam_width}
                  rounds: 1
                  expand: ${beam_expansion}
                  metric: "parent.delta.dG"
                  direction: min
                  steps:
                    - operation: select_positions
                      params:
                        source: alanine_scan
                        metric: ddG
                        threshold: 1.0
                        direction: below
                        top_k: 1
                        order: random
                        mode: ALLAA

                    - operation: design
                      params:
                        n_iterations: 1

                    - operation: analyze_interface
                      params:
                        calculate_binding_energy: true
                        chain_pairs: ${interface}

                    - compare: parent
