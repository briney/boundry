workflow_version: 1

project_path: .
interface: null
scan_chains: null

input: input.pdb
seed: 42
workers: 16

# expand_factor should be >= the expected number of bad positions
# so random sampling covers most of them
expand_factor: 20

steps:
  # Step 1: Fix backbone geometry once
  - operation: idealize

  # Step 2: Initial relax (done once, not every round)
  - operation: relax
    params:
      n_iterations: 3

  # Step 3: Iterative improvement rounds
  - iterate:
      n: 10
      steps:
        # 3a: Analyze interface to find bad positions
        - operation: analyze_interface
          params:
            calculate_binding_energy: true
            alanine_scan: true
            chain_pairs: ${interface}
            scan_chains: ${scan_chains}

        # 3b: Checkpoint the current "parent" for this round
        - checkpoint: parent

        # 3c: Beam search over single-position designs
        #     Each expansion picks 1 random bad position and designs it.
        #     With expand=20, we sample 20 random positions, keeping the
        #     best 4 by dG improvement vs parent.
        - beam:
            width: 4
            rounds: 1
            expand: ${expand_factor}
            metric: "parent.delta.dG"
            direction: min
            steps:
              - operation: select_positions
                params:
                  source: alanine_scan
                  metric: ddG
                  threshold: 1.0
                  direction: below
                  top_k: 1
                  order: random
                  mode: ALLAA

              - operation: design
                params:
                  n_iterations: 1

              - operation: relax
                params:
                  n_iterations: 1

              - operation: analyze_interface
                params:
                  calculate_binding_energy: true
                  chain_pairs: ${interface}
                  scan_chains: ${scan_chains}

              - compare: parent
